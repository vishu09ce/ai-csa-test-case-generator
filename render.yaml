services:
  - type: web
    name: ai-csa-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: LITELLM_MODEL
        value: groq/openai/gpt-oss-120b
      - key: DATABASE_URL
        value: sqlite:///./app.db
      - key: FRONTEND_URL
        value: https://vishu09ce.github.io
